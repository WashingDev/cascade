name: Build Cadence APK

on:
  push:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK and install API 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "sdkmanager not found in $SDK_DIR"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "cmdline-tools;latest" || true
          SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            ls -lh debug.keystore
          else
            echo "Missing debug.keystore.base64"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload Cadence APK
        uses: actions/upload-artifact@v4
        with:
          name: cadence-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
